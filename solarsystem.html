<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        .hud {
            position: fixed;
            top: 12px;
            left: 12px;
            color: #cfd8dc;
            font: 14px/1.5 monospace;
            pointer-events: none;
        }
        .hud a { color: #7fdbca; pointer-events: auto; }
    </style>
</head>
<body>
<div class="hud">
    <a href="./">&larr; back to console</a><br>
    Drag to rotate, scroll to zoom, right-drag to pan.<br>
    + / - change speed, space pauses.
</div>
<script type="module" src="/src/solarsystem.js"></script>
</body>
</html>
